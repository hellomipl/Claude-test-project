<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      font-family: Arial, sans-serif;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
      padding: 2rem 2.5rem;
      width: 100%;
      max-width: 380px;
    }

    .card h2 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      color: #1a1a2e;
      text-align: center;
    }

    .card p {
      margin: 0 0 1.5rem;
      font-size: 0.875rem;
      color: #666;
      text-align: center;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    .field label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #444;
    }

    .field input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1.5px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
      transition: border-color 0.2s;
      outline: none;
    }

    .field input:focus {
      border-color: #4a90e2;
    }

    .field input.invalid {
      border-color: #e53e3e;
      background: #fff5f5;
    }

    .error {
      display: none;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.35rem;
      font-size: 0.8rem;
      color: #e53e3e;
    }

    .error.visible {
      display: flex;
    }

    .error::before {
      content: "⚠";
      font-size: 0.85rem;
    }

    .success {
      display: none;
      padding: 0.75rem;
      background: #f0fff4;
      border: 1.5px solid #68d391;
      border-radius: 5px;
      font-size: 0.875rem;
      color: #276749;
      text-align: center;
      margin-bottom: 1rem;
    }

    .success.visible {
      display: block;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.7rem;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    button[type="submit"]:hover {
      background: #357abd;
    }

    .back-to-login {
      display: block;
      margin-top: 0.75rem;
      text-align: center;
      font-size: 0.875rem;
      color: #4a90e2;
      text-decoration: none;
    }

    .back-to-login:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <form id="forgot-password-form" novalidate>
      <h2>Forgot Password</h2>
      <p>Enter your email address and we'll send you a link to reset your password.</p>
      <div class="success" id="success-message" role="status">Password reset link sent! Check your email.</div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" aria-describedby="email-error" aria-invalid="false">
        <span class="error" id="email-error" role="alert">Please enter a valid email address.</span>
      </div>
      <button type="submit">Send Reset Link</button>
      <a href="First-file.html" class="back-to-login">Back to Login</a>
    </form>
  </div>

  <script>
    document.getElementById('forgot-password-form').addEventListener('submit', function (e) {
      e.preventDefault();

      var emailInput = document.getElementById('email');
      var emailError = document.getElementById('email-error');
      var successMessage = document.getElementById('success-message');
      var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!emailInput.value.trim() || !emailPattern.test(emailInput.value.trim())) {
        emailError.classList.add('visible');
        emailInput.classList.add('invalid');
        emailInput.setAttribute('aria-invalid', 'true');
        successMessage.classList.remove('visible');
      } else {
        emailError.classList.remove('visible');
        emailInput.classList.remove('invalid');
        emailInput.setAttribute('aria-invalid', 'false');
        successMessage.classList.add('visible');
      }
    });
  </script>
</body>
</html>
