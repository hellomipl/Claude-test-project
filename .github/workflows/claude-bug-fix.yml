name: Claude Bug Fix

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  fix:
    if: github.event.issue.pull_request == null && github.event.label.name == 'claude-fix-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Claude fix
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            This bug has been approved for an automated fix.

            Repository: ${{ github.repository }}
            Issue #${{ github.event.issue.number }}
            Title: ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Task:
            1. Read CLAUDE.md and repository context.
            2. Implement the smallest safe fix.
            3. Update or add tests if needed.
            4. Create a pull request linked to this issue.
            5. In the PR body, include:
               - root cause
               - files changed
               - test impact
               - any risks or follow-ups

          claude_args: |
            --max-turns 10