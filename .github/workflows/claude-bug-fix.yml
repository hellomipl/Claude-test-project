name: Claude Bug Fix

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  fix:
    if: github.event.issue.pull_request == null && github.event.label.name == 'claude-fix-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Claude fix
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            A bug issue has been approved for implementation.

            Repository: ${{ github.repository }}
            Issue #${{ github.event.issue.number }}
            Title: ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Read CLAUDE.md and repository context.

            Task:
            1. Understand the bug from the issue.
            2. Implement the smallest safe fix in the codebase.
            3. Update tests if needed.
            4. Create a pull request with the fix.
            5. Do not merge the PR.
            6. Keep changes minimal and focused only on this bug.
          claude_args: >-
            --max-turns 20
            --allowedTools Read,Edit,Write,Glob,Grep,WebFetch,WebSearch,Bash(git:*),Bash(gh pr *),Bash(gh issue *),Bash(npm:*),Bash(node:*)