name: Move issue to Ready for testing

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  move-card:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Move linked issue card to Ready for testing
        uses: actions/github-script@v8
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          STATUS_FIELD_ID: ${{ vars.STATUS_FIELD_ID }}
          READY_FOR_TESTING_OPTION_ID: ${{ vars.READY_FOR_TESTING_OPTION_ID }}
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const body = context.payload.pull_request.body || "";

            const match = body.match(/Issue:\s*#(\d+)/i);
            if (!match) {
              core.setFailed("PR body does not contain 'Issue: #123'");
              return;
            }

            const issueNumber = parseInt(match[1], 10);

            const projectId = process.env.PROJECT_ID;
            const statusFieldId = process.env.STATUS_FIELD_ID;
            const optionId = process.env.READY_FOR_TESTING_OPTION_ID;

            const result = await github.graphql(`
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  issue(number:$number) {
                    projectItems(first: 20) {
                      nodes {
                        id
                        project {
                          id
                        }
                      }
                    }
                  }
                }
              }
            `, {
              owner,
              repo,
              number: issueNumber
            });

            const item = result.repository.issue.projectItems.nodes.find(
              n => n.project.id === projectId
            );

            if (!item) {
              core.setFailed("Issue is not in the target project.");
              return;
            }

            await github.graphql(`
              mutation($projectId:ID!, $itemId:ID!, $fieldId:ID!, $optionId:String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            `, {
              projectId,
              itemId: item.id,
              fieldId: statusFieldId,
              optionId
            });