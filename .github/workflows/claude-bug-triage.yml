name: Claude Bug Triage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  triage:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Claude triage
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            A new bug issue was created.

            Repository: ${{ github.repository }}
            Issue #${{ github.event.issue.number }}
            Title: ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Read CLAUDE.md and repository context.

            Analyze this bug and return:
            - summary
            - likely_root_cause
            - impacted_modules_files
            - suggested_fix_options
            - confidence

          claude_args: |
            --max-turns 6
            --json-schema {
              "type":"object",
              "properties":{
                "summary":{"type":"string"},
                "likely_root_cause":{"type":"string"},
                "impacted_modules_files":{
                  "type":"array",
                  "items":{"type":"string"}
                },
                "suggested_fix_options":{
                  "type":"array",
                  "items":{"type":"string"}
                },
                "confidence":{"type":"string"}
              },
              "required":[
                "summary",
                "likely_root_cause",
                "impacted_modules_files",
                "suggested_fix_options",
                "confidence"
              ]
            }

      - name: Post triage comment
        uses: actions/github-script@v8
        env:
          CLAUDE_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        with:
          script: |
            const data = JSON.parse(process.env.CLAUDE_OUTPUT);

            const body = [
              "## Claude triage",
              "",
              `**Summary**`,
              data.summary,
              "",
              `**Likely root cause**`,
              data.likely_root_cause,
              "",
              `**Impacted modules/files**`,
              ...(data.impacted_modules_files || []).map(x => `- ${x}`),
              "",
              `**Suggested fix options**`,
              ...(data.suggested_fix_options || []).map(x => `- ${x}`),
              "",
              `**Confidence**: ${data.confidence}`
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });