<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      font-family: Arial, sans-serif;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
      padding: 2rem 2.5rem;
      width: 100%;
      max-width: 380px;
    }

    .card h2 {
      margin: 0 0 1.5rem;
      font-size: 1.5rem;
      color: #1a1a2e;
      text-align: center;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    .field label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #444;
    }

    .field input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1.5px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
      transition: border-color 0.2s;
      outline: none;
    }

    .field input:focus {
      border-color: #4a90e2;
    }

    .field input.invalid {
      border-color: #e53e3e;
      background: #fff5f5;
    }

    .error {
      display: none;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.35rem;
      font-size: 0.8rem;
      color: #e53e3e;
    }

    .error.visible {
      display: flex;
    }

    .error::before {
      content: "⚠";
      font-size: 0.85rem;
    }

    .success {
      display: none;
      padding: 0.75rem;
      background: #f0fff4;
      border: 1.5px solid #68d391;
      border-radius: 5px;
      font-size: 0.875rem;
      color: #276749;
      text-align: center;
      margin-bottom: 1rem;
    }

    .success.visible {
      display: block;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.7rem;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    button[type="submit"]:hover {
      background: #357abd;
    }

    .back-to-login {
      display: block;
      margin-top: 0.75rem;
      text-align: center;
      font-size: 0.875rem;
      color: #4a90e2;
      text-decoration: none;
    }

    .back-to-login:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <form id="register-form" novalidate>
      <h2>Create Account</h2>
      <div class="success" id="success-message">Account created! You can now log in.</div>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username">
        <span class="error" id="username-error">Username is required.</span>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
        <span class="error" id="email-error">Please enter a valid email address.</span>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password">
        <span class="error" id="password-error">Password must be at least 6 characters.</span>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <input type="password" id="confirm-password" name="confirm-password">
        <span class="error" id="confirm-password-error">Passwords must match.</span>
      </div>
      <button type="submit">Create Account</button>
      <a href="First-file.html" class="back-to-login">Back to Login</a>
    </form>
  </div>

  <script>
    document.getElementById('register-form').addEventListener('submit', function (e) {
      e.preventDefault();

      var valid = true;
      var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      var usernameInput = document.getElementById('username');
      var usernameError = document.getElementById('username-error');
      if (!usernameInput.value.trim()) {
        usernameError.classList.add('visible');
        usernameInput.classList.add('invalid');
        valid = false;
      } else {
        usernameError.classList.remove('visible');
        usernameInput.classList.remove('invalid');
      }

      var emailInput = document.getElementById('email');
      var emailError = document.getElementById('email-error');
      if (!emailInput.value.trim() || !emailPattern.test(emailInput.value.trim())) {
        emailError.classList.add('visible');
        emailInput.classList.add('invalid');
        valid = false;
      } else {
        emailError.classList.remove('visible');
        emailInput.classList.remove('invalid');
      }

      var passwordInput = document.getElementById('password');
      var passwordError = document.getElementById('password-error');
      if (passwordInput.value.length < 6) {
        passwordError.classList.add('visible');
        passwordInput.classList.add('invalid');
        valid = false;
      } else {
        passwordError.classList.remove('visible');
        passwordInput.classList.remove('invalid');
      }

      var confirmInput = document.getElementById('confirm-password');
      var confirmError = document.getElementById('confirm-password-error');
      if (confirmInput.value !== passwordInput.value || !confirmInput.value) {
        confirmError.classList.add('visible');
        confirmInput.classList.add('invalid');
        valid = false;
      } else {
        confirmError.classList.remove('visible');
        confirmInput.classList.remove('invalid');
      }

      var successMessage = document.getElementById('success-message');
      if (valid) {
        successMessage.classList.add('visible');
      } else {
        successMessage.classList.remove('visible');
      }
    });
  </script>
</body>
</html>
